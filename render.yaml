# Blueprint de Render: sitio estático (plan gratuito), sin build.
# Render no lee _headers (ese archivo es de Cloudflare Pages), así que las mismas
# cabeceras de seguridad y caché se declaran aquí. Si cambias una, cambia las dos.
services:
  - type: web
    name: ortodoncia-quiceno
    runtime: static
    branch: main
    buildCommand: echo "Sitio estatico, sin build"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/images/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
